name: bersih_laundry
description: Aplikasi kasir, invoice WhatsApp, laporan keuangan dan upah setrika untuk Bersih Laundry.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.0.0

dependencies:
  flutter:
    sdk: flutter
  shared_preferences: ^2.2.0
  url_launcher: ^6.2.0

dev_dependencies:
  flutter_launcher_icons: ^0.14.1

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon.png"
  adaptive_icon_background: "#1565E8"
  adaptive_icon_foreground: "assets/icon_fg.png"
  min_sdk_android: 21

flutter:
  uses-material-design: true
